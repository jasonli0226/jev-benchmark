[project]
name = "jev-bench"
version = "0.1.0"
description = "Benchmark of local ML models vs the Jev decision model on text and tabular classification."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "datasets>=2.19",
    "torch>=2.3",
    "transformers>=4.44",
    "accelerate>=0.33",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
jev-bench = "jev_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
