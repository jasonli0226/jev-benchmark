noun: person
question:
  type: noul
  instructions: "Does {target}, described by their 1994 US Census record, earn more than $50,000 a year?"
  criteria:
    "true": "The person's annual income is above $50,000."
    "false": "The person's annual income is $50,000 or less."
background: >
  Records come from the 1994 US Census. In this population about 24% of
  adults earn more than $50,000 a year. Higher income is associated with
  more education (Bachelors and above), being married (husband or wife in
  the household), managerial and professional occupations, working more
  than 40 hours per week, ages roughly 35 to 60, and any non-zero capital
  gains. Most people with no capital gains, under 25, or working part-time
  earn $50,000 or less.
